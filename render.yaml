services:
  - type: web
    name: bottega
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BOTTEGA_PATH
        sync: false
      - key: PAINT_MODEL
        value: google/gemini-3.1-flash-image-preview
      - key: ASK_MODEL
        value: openai/gpt-5-mini
      - key: SPEND_CAP_USD
        value: "2"
